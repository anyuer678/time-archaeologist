[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-archaeologist"
dynamic = ["version"]
description = "本地优先的数字资产考古工具：只读扫描目录，构建活动时间线与成果证据链"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "anyuer678"}]
keywords = ["file-timeline", "provenance", "read-only", "sqlite", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
time-archaeologist = "time_arch.cli:main"

[project.gui-scripts]
time-archaeologist-gui = "time_arch.ui.app:main"

[tool.setuptools]
packages = ["time_arch", "time_arch.ui"]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "time_arch.__version__"}
